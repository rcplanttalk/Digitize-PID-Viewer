[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "automation-labs-digitize-pid-viewer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cairosvg>=2.7.0",
    "huggingface-hub>=1.4.1",
    "networkx>=3.0",
    "Pillow>=10.0",
    "numpy>=1.24",
    "pycairo>=1.29.0",
]

[project.scripts]
digitize-pid-viewer = "main:main"
pid-gen = "pid_generator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "ruff>=0.15.1",
]
